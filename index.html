<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>review for muay y shop ✨</title>
    <style>
        :root {
            --bg-cream: #fffaf5;
            --card-white: #ffffff;
            --pink-pastel: #ffccd5;
            --pink-deep: #ff8fab;
            --pink-hover: #fb6f92;
            --purple-soft: #f3e8ff;
            --text-main: #6d5959;
            --text-sub: #9e8282;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            background-image: radial-gradient(#ffccd5 1px, transparent 1px);
            background-size: 24px 24px; /* ลายจุดพาสเทลจางๆ น่ารักๆ */
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-white);
            padding: 30px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(255, 179, 198, 0.25);
            border: 3px solid #ffe5ec;
            position: relative;
        }

        /* ปุ่มเปิดหลังบ้านมุมขวาบนแบบน่ารัก */
        .admin-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
        }

        .admin-toggle button {
            background-color: var(--purple-soft);
            color: #8b5cf6;
            border: 2px dashed #c4b5fd;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .admin-toggle button:hover {
            background-color: #ede9fe;
        }

        /* ส่วนหัวโปรไฟล์ร้านแบบใหม่ ละมุนตา */
        .store-header {
            text-align: center;
            padding-top: 15px;
            margin-bottom: 25px;
        }

        .store-avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .store-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--pink-pastel);
            box-shadow: 0 5px 15px rgba(255, 143, 171, 0.3);
        }

        h1 {
            margin: 5px 0 10px;
            color: #d85a7d;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .contact-box {
            background: #fff0f3;
            border-radius: 20px;
            padding: 12px 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px dashed var(--pink-deep);
            font-size: 0.95rem;
            color: #8c5867;
        }

        .rating-badge {
            font-size: 1.1rem;
            font-weight: bold;
            color: #b54569;
            background: #ffe5ec;
            padding: 8px 20px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(255, 181, 194, 0.4);
        }

        /* ส่วนหลังบ้านแอดมิน */
        #admin-panel {
            background: #fff5f7;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: none;
            border: 2px solid var(--pink-pastel);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #735d67;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 15px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--pink-deep);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button.main-btn {
            background-color: var(--pink-deep);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(255, 143, 171, 0.4);
            transition: 0.2s;
        }

        button.main-btn:hover {
            background-color: var(--pink-hover);
            transform: translateY(-2px);
        }

        /* ฟอร์มฝากรีวิวแบบกล่องการ์ดน่ารัก */
        .review-form-box {
            background: #fff9fa;
            padding: 25px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 2px solid #ffe5ec;
            box-shadow: inset 0 2px 8px rgba(255, 229, 236, 0.5);
        }

        .review-form-box h3 {
            margin-top: 0;
            color: #d85a7d;
            text-align: center;
        }

        /* รายการรีวิวสไตล์การ์ดลอยละล่อง */
        .section-title {
            text-align: center;
            color: #d85a7d;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .review-card {
            background: #ffffff;
            border: 2px solid #ffe5ec;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 6px 15px rgba(255, 214, 224, 0.2);
            transition: 0.2s;
        }

        .review-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 181, 194, 0.3);
        }

        .review-img {
            max-width: 160px;
            border-radius: 12px;
            margin-top: 12px;
            display: block;
            border: 2px dashed var(--pink-pastel);
        }

        .delete-btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 0.75rem;
            border-radius: 12px;
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            cursor: pointer;
            font-weight: bold;
        }

        .show-delete .delete-btn {
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <!-- ปุ่มเข้าหลังบ้าน -->
    <div class="admin-toggle">
        <button onclick="toggleAdmin()">⚙️ หลังบ้าน</button>
    </div>

    <!-- ส่วนหลังบ้าน (Admin Dashboard) -->
    <div id="admin-panel">
        <h3>🛠️ ระบบจัดการร้านค้า</h3>
        <div class="form-group">
            <label>เปลี่ยนชื่อร้าน:</label>
            <input type="text" id="admin-store-name" placeholder="ชื่อร้านค้า">
        </div>
        <div class="form-group">
            <label>เปลี่ยนรูปโปรไฟล์ร้าน (URL รูปภาพ):</label>
            <input type="text" id="admin-store-img" placeholder="วางลิงก์รูปภาพโปรไฟล์">
        </div>
        <button class="main-btn" onclick="updateStoreInfo()">บันทึกข้อมูลร้าน ✨</button>
        <p style="font-size: 0.8rem; color: var(--text-sub); margin-top: 8px; text-align: center;">*โหมดแอดมิน: สามารถกดปุ่ม "ลบรีวิว" สีแดงที่การ์ดรีวิวได้เลย</p>
    </div>

    <!-- โปรไฟล์ร้านค้าหลัก -->
    <div class="store-header">
        <div class="store-avatar-wrapper">
            <img id="store-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Store Logo" class="store-avatar">
        </div>
        <h1 id="store-title">review for muay y shop</h1>
        <div class="contact-box">
            ✨ fb : s𑄝l݂mua݁yiꫀིྀა ィ<br>
            💬 id line : @352gmaft
        </div>
        <div>
            <div class="rating-badge">
                ⭐ <span id="avg-rating">0.0</span> / 5.0 (<span id="total-reviews">0</span> รีวิว)
            </div>
        </div>
    </div>

    <!-- ฟอร์มส่งรีวิวจากลูกค้า -->
    <div class="review-form-box">
        <h3>💌 ฝากเครดิต & เขียนรีวิวความประทับใจ</h3>
        <form id="review-form" onsubmit="handleReviewSubmit(event)">
            <div class="form-group">
                <label>ชื่อลูกค้า / ลิงก์เครดิต (เฟซบุ๊ก หรือ IG):</label>
                <input type="text" id="cust-name" placeholder="เช่น คุณมิน (FB: Min Min)" required>
            </div>
            <div class="form-group">
                <label>ระดับความประทับใจ:</label>
                <select id="cust-rating">
                    <option value="5">⭐⭐⭐⭐⭐ 5 ดาว - น่ารัก บริการดีมากก!</option>
                    <option value="4">⭐⭐⭐⭐ 4 ดาว - ดีมาก ส่งไว</option>
                    <option value="3">⭐⭐⭐ 3 ดาว - ปานกลาง</option>
                    <option value="2">⭐⭐ 2 ดาว - ควรปรับปรุง</option>
                    <option value="1">⭐ 1 ดาว - แย่มาก</option>
                </select>
            </div>
            <div class="form-group">
                <label>ข้อความรีวิว / หลักฐาน:</label>
                <textarea id="cust-comment" placeholder="พิมพ์รีวิว หรือความประทับใจตรงนี้ได้เลยน้า..." required></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูปภาพรีวิว / สลิป:</label>
                <input type="file" id="cust-image" accept="image/*" style="padding: 8px; background: white; border-radius: 12px; border: 2px dashed #ffccd5;">
            </div>
            <button type="submit" class="main-btn">ส่งรีวิวเพิ่มเครดิต 💖</button>
        </form>
    </div>

    <!-- รายการแสดงรีวิวทั้งหมด -->
    <h3 class="section-title">☁️ รีวิวจากลูกค้าที่น่ารักทั้งหมด ☁️️</h3>
    <div id="reviews-list">
        <!-- รายการรีวิวจะแสดงตรงนี้อัตโนมัติ -->
    </div>
</div>

<script>
    let storeData = {
        name: "review for muay y shop",
        image: "https://i.imgur.com/6VBx3io.png"
    };

    let reviews = [
        {
            name: "คุณมีน (IG: meen_Review)",
            rating: 5,
            comment: "ร้านนี้บริการดีมากค่ะ ส่งจริงไม่มีโกง ไว้มาอุดหนุนอีกแน่นอนค่ะ! 💖",
            image: ""
        }
    ];

    let isAdminLoggedIn = false;

    function toggleAdmin() {
        if (!isAdminLoggedIn) {
            let pass = prompt("กรุณากรอกรหัสผ่านแอดมิน (ตั้งค่าไว้: 1234):");
            if (pass === "1234") {
                isAdminLoggedIn = true;
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('app-container').classList.add('show-delete');
                document.getElementById('admin-store-name').value = storeData.name;
                document.getElementById('admin-store-img').value = storeData.image;
                alert("เข้าสู่ระบบหลังบ้านสำเร็จค่า! ✨");
            } else if (pass !== null) {
                alert("รหัสผ่านไม่ถูกต้องน้า!");
            }
        } else {
            isAdminLoggedIn = false;
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('app-container').classList.remove('show-delete');
            alert("ออกจากระบบหลังบ้านแล้วจ้า");
        }
        renderReviews();
    }

    function updateStoreInfo() {
        let newName = document.getElementById('admin-store-name').value;
        let newImg = document.getElementById('admin-store-img').value;
        if(newName) storeData.name = newName;
        if(newImg) storeData.image = newImg;
        
        document.getElementById('store-title').innerText = storeData.name;
        document.getElementById('store-avatar').src = storeData.image;
        alert("อัปเดตข้อมูลร้านเรียบร้อยแล้วค่ะ! 🎉");
    }

    function handleReviewSubmit(event) {
        event.preventDefault();
        
        let name = document.getElementById('cust-name').value;
        let rating = Number(document.getElementById('cust-rating').value);
        let comment = document.getElementById('cust-comment').value;
        let imageInput = document.getElementById('cust-image');

        if (imageInput.files && imageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                reviews.unshift({ name, rating, comment, image: e.target.result });
                resetFormAndRender();
            }
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            reviews.unshift({ name, rating, comment, image: "" });
            resetFormAndRender();
        }
    }

    function resetFormAndRender() {
        document.getElementById('review-form').reset();
        renderReviews();
        alert("ส่งรีวิวสำเร็จ ขอบคุณมากๆ เลยนะคะ! ✨💖");
    }

    function deleteReview(index) {
        if (confirm("ต้องการลบคอมเม้นต์นี้ใช่ไหมคะ?")) {
            reviews.splice(index, 1);
            renderReviews();
        }
    }

    function renderReviews() {
        let listContainer = document.getElementById('reviews-list');
        listContainer.innerHTML = "";

        if (reviews.length === 0) {
            listContainer.innerHTML = "<p style='text-align: center; color: var(--text-sub); padding: 20px;'>ยังไม่มีรีวิวในขณะนี้ มาเป็นคนแรกที่ทิ้งเครดิตกันเถอะ! ✨</p>";
            document.getElementById('avg-rating').innerText = "0.0";
            document.getElementById('total-reviews').innerText = "0";
            return;
        }

        let sumRating = 0;
        reviews.forEach((rev, index) => {
            sumRating += rev.rating;
            
            let stars = "⭐".repeat(rev.rating);
            let imgTag = rev.image ? `<img src="${rev.image}" class="review-img" alt="รูปรีวิว">` : "";
            
            let card = document.createElement('div');
            card.className = "review-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteReview(${index})">🗑️️ ลบรีวิว</button>
                <div style="font-weight: bold; color: #d85a7d; font-size: 1.05rem;">👤 ${rev.name}</div>
                <div style="margin: 6px 0;">${stars}</div>
                <p style="margin: 8px 0 12px; line-height: 1.5;">${rev.comment}</p>
                ${imgTag}
            `;
            listContainer.appendChild(card);
        });

        let avg = (sumRating / reviews.length).toFixed(1);
        document.getElementById('avg-rating').innerText = avg;
        document.getElementById('total-reviews').innerText = reviews.length;
    }

    renderReviews();
</script>

</body>
</html>
