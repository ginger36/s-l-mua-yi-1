<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">ระบบจัดการร้านค้า</title>
    <!-- นำเข้า Google Fonts และ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen text-gray-800">

    <!-- ส่วนหัวเว็บไซต์ -->
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="store-logo" src="" alt="Logo" class="w-10 h-10 rounded-full object-cover border hidden">
            <h1 id="store-title" class="text-xl font-bold text-pink-600">ร้านค้าของฉัน</h1>
        </div>
        <div class="flex gap-2">
            <a id="fb-btn" href="#" target="_blank" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-700 transition">Facebook</a>
            <a id="line-btn" href="#" target="_blank" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-green-700 transition">Line</a>
            <button onclick="openAdminModal()" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-gray-300 transition">⚙️ หลังบ้าน</button>
        </div>
    </header>

    <!-- เนื้อหาหลัก -->
    <main class="max-w-4xl mx-auto p-4 mt-6">
        <!-- ฟอร์มส่งรีวิว -->
        <section class="bg-white p-6 rounded-2xl shadow-sm mb-8">
            <h2 class="text-lg font-bold mb-4 text-pink-700">✍️ เขียนรีวิวให้กับเรา</h2>
            <form id="review-form" onsubmit="submitReview(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">ชื่อของคุณ</label>
                    <input type="text" id="review-name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ให้คะแนนดาว</label>
                    <select id="review-stars" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
                        <option value="5">⭐⭐⭐⭐⭐ (5 ดาว)</option>
                        <option value="4">⭐⭐⭐⭐ (4 ดาว)</option>
                        <option value="3">⭐⭐⭐ (3 ดาว)</option>
                        <option value="2">⭐⭐ (2 ดาว)</option>
                        <option value="1">⭐ (1 ดาว)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">ข้อความรีวิว</label>
                    <textarea id="review-text" rows="3" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea>
                </div>
                <button type="submit" class="w-full bg-pink-500 text-white font-medium py-2 rounded-lg hover:bg-pink-600 transition">ส่งรีวิว</button>
            </form>
        </section>

        <!-- แสดงรายการรีวิว -->
        <section>
            <h2 class="text-lg font-bold mb-4 text-pink-700">💬 ความประทับใจจากลูกค้า</h2>
            <div id="reviews-container" class="space-y-4">
                <p class="text-gray-500 text-center py-4">กำลังโหลดรีวิว...</p>
            </div>
        </section>
    </main>

    <!-- Modal หลังบ้าน (Admin Login & Settings) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div id="login-view">
                <h3 class="text-lg font-bold mb-4 text-gray-800">🔐 เข้าสู่ระบบหลังบ้าน</h3>
                <input type="password" id="admin-pwd-input" placeholder="กรอกรหัสผ่านแอดมิน" class="w-full border rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
                <div class="flex justify-end gap-2">
                    <button onclick="closeAdminModal()" class="px-4 py-2 bg-gray-200 rounded-lg text-sm">ยกเลิก</button>
                    <button onclick="checkAdminLogin()" class="px-4 py-2 bg-pink-500 text-white rounded-lg text-sm hover:bg-pink-600">เข้าสู่ระบบ</button>
                </div>
            </div>

            <div id="settings-view" class="hidden">
                <h3 class="text-lg font-bold mb-4 text-gray-800">⚙️ ตั้งค่าร้านค้า & จัดการรีวิว</h3>
                <div class="space-y-3 mb-6">
                    <div>
                        <label class="block text-xs font-medium text-gray-600">ชื่อร้าน</label>
                        <input type="text" id="set-title" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">ลิงก์รูปโลโก้ร้าน (URL หรือรูปภาพ)</label>
                        <input type="text" id="set-logo" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">ชื่อ Facebook</label>
                        <input type="text" id="set-fbName" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">ลิงก์ Facebook</label>
                        <input type="text" id="set-fbLink" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Line ID</label>
                        <input type="text" id="set-lineId" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">ลิงก์ Line</label>
                        <input type="text" id="set-lineLink" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600">เปลี่ยนรหัสผ่านแอดมินใหม่</label>
                        <input type="password" id="set-adminPwd" class="w-full border rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <button onclick="saveSettings()" class="w-full bg-green-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-700">บันทึกการตั้งค่า</button>
                </div>
                
                <h4 class="font-bold text-sm mb-2 text-red-600">🗑️ จัดการลบรีวิว</h4>
                <div id="admin-reviews-list" class="space-y-2 max-h-40 overflow-y-auto border p-2 rounded-lg mb-4 text-sm">
                    <!-- รายการรีวิวสำหรับลบ -->
                </div>

                <div class="flex justify-end">
                    <button onclick="closeAdminModal()" class="px-4 py-2 bg-gray-500 text-white rounded-lg text-sm">ปิดหน้าต่าง</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script ระบบจัดการ -->
    <script>
        const BIN_ID = "6ac104eeac6210605a0f93a7";
        const API_KEY = "$2a$10$R6oEPi9JbFrhp/wFED0s0uc0oWEwApNbF6zgE7tkm6TEBdgbhY1ru";
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let globalData = { 
            settings: {
                title: "ร้านค้าของฉัน",
                logo: "",
                fbName: "Facebook",
                fbLink: "#",
                lineId: "@line",
                lineLink: "#",
                adminPwd: "1234"
            }, 
            reviews: [] 
        };

        // โหลดข้อมูลทั้งหมดเมื่อเปิดเว็บ
        async function loadData() {
            try {
                let res = await fetch(BASE_URL, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (res.ok) {
                    let json = await res.json();
                    if (json.record) {
                        globalData = json.record;
                    }
                }
            } catch (err) {
                console.warn("ไม่สามารถโหลดจาก Cloud ได้ ใช้ค่าเริ่มต้นแทน", err);
            }
            renderUI();
        }

        // แสดงผลหน้าเว็บ
        function renderUI() {
            let s = globalData.settings || {};
            document.getElementById('page-title').innerText = s.title || "ร้านค้าของฉัน";
            document.getElementById('store-title').innerText = s.title || "ร้านค้าของฉัน";
            
            let logoImg = document.getElementById('store-logo');
            if (s.logo && s.logo.trim() !== "") {
                logoImg.src = s.logo;
                logoImg.classList.remove('hidden');
            } else {
                logoImg.classList.add('hidden');
            }

            let fbBtn = document.getElementById('fb-btn');
            fbBtn.href = s.fbLink || "#";
            fbBtn.innerText = s.fbName || "Facebook";

            let lineBtn = document.getElementById('line-btn');
            lineBtn.href = s.lineLink || "#";

            // เรนเดอร์รีวิว
            let container = document.getElementById('reviews-container');
            if (!globalData.reviews || globalData.reviews.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-4">ยังไม่มีรีวิว มาเป็นคนแรกกันเถอะ!</p>`;
                return;
            }

            container.innerHTML = globalData.reviews.map(r => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-pink-100">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-gray-700">${escapeHtml(r.name || 'ไม่ระบุชื่อ')}</span>
                        <span class="text-yellow-400 text-sm">${'⭐'.repeat(r.stars || 5)}</span>
                    </div>
                    <p class="text-gray-600 text-sm">${escapeHtml(r.text || '')}</p>
                </div>
            `).join('');
        }

        // ส่งรีวิวใหม่
        async function submitReview(e) {
            e.preventDefault();
            let name = document.getElementById('review-name').value;
            let stars = parseInt(document.getElementById('review-stars').value);
            let text = document.getElementById('review-text').value;

            if (!globalData.reviews) {
                globalData.reviews = [];
            }

            globalData.reviews.unshift({ name, stars, text });

            await updateCloudData();
            document.getElementById('review-form').reset();
            alert("ส่งรีวิวสำเร็จ!");
        }

        // อัปเดตข้อมูลขึ้น Cloud (JSONBin)
        async function updateCloudData() {
            try {
                let res = await fetch(BASE_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(globalData)
                });
                if (res.ok) {
                    loadData();
                } else {
                    alert("บันทึกข้อมูลลง Cloud ไม่สำเร็จ (Status code: " + res.status + ")");
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย");
            }
        }

        // จัดการหลังบ้าน
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('settings-view').classList.add('hidden');
            document.getElementById('admin-pwd-input').value = '';
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function checkAdminLogin() {
            let pwd = document.getElementById('admin-pwd-input').value;
            let correctPwd = (globalData.settings && globalData.settings.adminPwd) ? globalData.settings.adminPwd : "1234";

            if (pwd === correctPwd) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('settings-view').classList.remove('hidden');
                
                let s = globalData.settings || {};
                document.getElementById('set-title').value = s.title || "";
                document.getElementById('set-logo').value = s.logo || "";
                document.getElementById('set-fbName').value = s.fbName || "";
                document.getElementById('set-fbLink').value = s.fbLink || "";
                document.getElementById('set-lineId').value = s.lineId || "";
                document.getElementById('set-lineLink').value = s.lineLink || "";
                document.getElementById('set-adminPwd').value = s.adminPwd || "1234";

                renderAdminReviews();
            } else {
                alert("รหัสผ่านไม่ถูกต้อง!");
            }
        }

        async function saveSettings() {
            if (!globalData.settings) globalData.settings = {};
            globalData.settings.title = document.getElementById('set-title').value;
            globalData.settings.logo = document.getElementById('set-logo').value;
            globalData.settings.fbName = document.getElementById('set-fbName').value;
            globalData.settings.fbLink = document.getElementById('set-fbLink').value;
            globalData.settings.lineId = document.getElementById('set-lineId').value;
            globalData.settings.lineLink = document.getElementById('set-lineLink').value;
            globalData.settings.adminPwd = document.getElementById('set-adminPwd').value;

            await updateCloudData();
            alert("บันทึกการตั้งค่าร้านค้าสำเร็จ!");
            closeAdminModal();
        }

        function renderAdminReviews() {
            let list = document.getElementById('admin-reviews-list');
            if (!globalData.reviews || globalData.reviews.length === 0) {
                list.innerHTML = `<p class="text-gray-400 text-xs">ไม่มีรีวิว</p>`;
                return;
            }
            list.innerHTML = globalData.reviews.map((r, index) => `
                <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
                    <span><b>${escapeHtml(r.name)}</b>: ${escapeHtml(r.text)}</span>
                    <button onclick="deleteReview(${index})" class="text-red-500 hover:text-red-700 text-xs font-bold">ลบ</button>
                </div>
            `).join('');
        }

        async function deleteReview(index) {
            if (confirm("ต้องการลบรีวิวนี้ใช่หรือไม่?")) {
                globalData.reviews.splice(index, 1);
                await updateCloudData();
                renderAdminReviews();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บครั้งแรก
        loadData();
    </script>
</body>
</html>
