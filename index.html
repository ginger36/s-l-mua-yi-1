<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>review for muay y shop 💖</title>
    <style>
        :root {
            --bg-cream: #fffdf9;
            --card-bg: #ffffff;
            --pink-light: #ffeaef;
            --pink-pastel: #ffb3c6;
            --pink-deep: #ff7096;
            --pink-hover: #ff477e;
            --text-main: #5c4b51;
            --text-sub: #9e828d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            background-image: radial-gradient(var(--pink-light) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
        }

        .main-wrapper {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 30px;
            box-shadow: 0 12px 35px rgba(255, 179, 198, 0.25);
            border: 3px solid #ffe3ec;
            position: relative;
        }

        /* ปุ่มเปิดหลังบ้านมุมขวาบน */
        .admin-btn-box {
            position: absolute;
            top: 25px;
            right: 25px;
        }

        .admin-btn-box button {
            background-color: var(--pink-light);
            color: var(--pink-deep);
            border: 2px dashed var(--pink-pastel);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .admin-btn-box button:hover {
            background-color: var(--pink-pastel);
            color: white;
        }

        /* ส่วนหัวโปรไฟล์ร้าน */
        .store-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .store-avatar {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--pink-pastel);
            box-shadow: 0 6px 15px rgba(255, 112, 150, 0.2);
            margin-bottom: 12px;
        }

        h1 {
            margin: 0 0 8px 0;
            color: #d6517a;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .contact-tag {
            background: #fff5f7;
            border: 1px solid #ffd6e0;
            padding: 10px 18px;
            border-radius: 18px;
            display: inline-block;
            font-size: 0.9rem;
            color: #7d5b67;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .rating-box {
            background: #fff0f3;
            color: #c9426c;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(255, 179, 198, 0.3);
        }

        /* แผงหลังบ้าน (Admin Panel) */
        #admin-panel {
            background: #fff5f7;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: none;
            border: 2px solid var(--pink-pastel);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #7d5b67;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 11px;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--pink-deep);
        }

        textarea {
            resize: vertical;
            height: 85px;
        }

        .btn-action {
            background-color: var(--pink-deep);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 112, 150, 0.3);
            transition: 0.2s;
        }

        .btn-action:hover {
            background-color: var(--pink-hover);
        }

        /* ฟอร์มส่งรีวิวฝั่งลูกค้า */
        .review-form-container {
            background: #fffcfd;
            padding: 22px;
            border-radius: 22px;
            margin-bottom: 25px;
            border: 2px dashed var(--pink-pastel);
        }

        .review-form-container h3 {
            margin-top: 0;
            color: #d6517a;
            text-align: center;
        }

        /* รายการรีวิว */
        .section-title {
            text-align: center;
            color: #d6517a;
            margin-bottom: 18px;
            font-size: 1.2rem;
        }

        .review-card {
            background: #ffffff;
            border: 1px solid #ffe3ec;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 5px 15px rgba(255, 214, 224, 0.2);
        }

        .review-img {
            max-width: 140px;
            border-radius: 10px;
            margin-top: 10px;
            display: block;
            border: 1px solid #ffd6e0;
        }

        .delete-btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 10px;
            position: absolute;
            top: 18px;
            right: 18px;
            display: none;
            cursor: pointer;
            font-weight: bold;
        }

        .show-delete .delete-btn {
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="main-wrapper" id="app-container">
    <!-- ปุ่มหลังบ้าน -->
    <div class="admin-btn-box">
        <button onclick="toggleAdmin()">⚙️ หลังบ้าน</button>
    </div>

    <!-- ส่วนจัดการหลังบ้าน (Admin Panel) -->
    <div id="admin-panel">
        <h3>🛠️ ระบบจัดการร้านค้าแอดมิน</h3>
        <div class="form-group">
            <label>เปลี่ยนชื่อร้าน:</label>
            <input type="text" id="admin-store-name" placeholder="ชื่อร้านค้า">
        </div>
        <div class="form-group">
            <label>เปลี่ยนรูปโปรไฟล์ร้าน (URL รูปภาพ):</label>
            <input type="text" id="admin-store-img" placeholder="วางลิงก์รูปภาพโปรไฟล์">
        </div>
        <button class="btn-action" onclick="updateStoreInfo()">บันทึกข้อมูลร้าน ✨</button>
        <p style="font-size: 0.8rem; color: var(--text-sub); margin-top: 8px; text-align: center;">*โหมดแอดมิน: สามารถกดปุ่ม "ลบ" ที่การ์ดรีวิวเพื่อจัดการรีวิวปั่นเครดิตได้</p>
    </div>

    <!-- ส่วนโปรไฟล์และข้อมูลหัวเว็บ -->
    <div class="store-header">
        <img id="store-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Store Logo" class="store-avatar">
        <h1 id="store-title">review for muay y shop</h1>
        <div class="contact-tag">
            fb : s𑄝l݂mua݁yiꫀིྀა ィ<br>
            id line : @352gmaft
        </div>
        <div>
            <div class="rating-box">
                ⭐ <span id="avg-rating">0.0</span> / 5.0 (<span id="total-reviews">0</span> รีวิว)
            </div>
        </div>
    </div>

    <!-- ฟอร์มส่งรีวิวจากลูกค้า -->
    <div class="review-form-container">
        <h3>💬 ฝากเครดิต / เขียนรีวิวความประทับใจ</h3>
        <form id="review-form" onsubmit="handleReviewSubmit(event)">
            <div class="form-group">
                <label>ชื่อลูกค้า / ลิงก์เครดิต:</label>
                <input type="text" id="cust-name" placeholder="เช่น คุณมิน (FB: Min Min)" required>
            </div>
            <div class="form-group">
                <label>ระดับคะแนนความพึงพอใจ:</label>
                <select id="cust-rating">
                    <option value="5">⭐⭐⭐⭐⭐ 5 ดาว - บริการดีมาก ส่งไว เชื่อถือได้</option>
                    <option value="4">⭐⭐⭐⭐ 4 ดาว - ดีมาก</option>
                    <option value="3">⭐⭐⭐ 3 ดาว - ปานกลาง</option>
                    <option value="2">⭐⭐ 2 ดาว - ควรปรับปรุง</option>
                    <option value="1">⭐ 1 ดาว - แย่มาก</option>
                </select>
            </div>
            <div class="form-group">
                <label>ข้อความรีวิว:</label>
                <textarea id="cust-comment" placeholder="พิมพ์ความประทับใจตรงนี้ได้เลยน้า..." required></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูปภาพรีวิว / สลิปหลักฐาน:</label>
                <input type="file" id="cust-image" accept="image/*" style="padding: 6px; background: white; border-radius: 10px; border: 1px solid #ffccd5;">
            </div>
            <button type="submit" class="btn-action">ส่งรีวิว / เพิ่มเครดิต 💖</button>
        </form>
    </div>

    <!-- รายการแสดงรีวิวทั้งหมด -->
    <h3 class="section-title">📜 รายการเครดิตและรีวิวทั้งหมด</h3>
    <div id="reviews-list">
        <!-- รายการรีวิวจะแสดงตรงนี้อัตโนมัติ -->
    </div>
</div>

<script>
    let storeData = {
        name: "review for muay y shop",
        image: "https://i.imgur.com/6VBx3io.png"
    };

    let reviews = [
        {
            name: "คุณมีน (IG: meen_Review)",
            rating: 5,
            comment: "ร้านนี้บริการดีมากค่ะ ส่งจริงไม่มีโกง ไว้มาอุดหนุนอีกแน่นอนค่ะ! 💖",
            image: ""
        }
    ];

    let isAdminLoggedIn = false;

    function toggleAdmin() {
        if (!isAdminLoggedIn) {
            let pass = prompt("กรุณากรอกรหัสผ่านแอดมิน (ตั้งค่าไว้: 1234):");
            if (pass === "1234") {
                isAdminLoggedIn = true;
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('app-container').classList.add('show-delete');
                document.getElementById('admin-store-name').value = storeData.name;
                document.getElementById('admin-store-img').value = storeData.image;
                alert("เข้าสู่ระบบหลังบ้านสำเร็จค่า! ✨");
            } else if (pass !== null) {
                alert("รหัสผ่านไม่ถูกต้องน้า!");
            }
        } else {
            isAdminLoggedIn = false;
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('app-container').classList.remove('show-delete');
            alert("ออกจากระบบหลังบ้านแล้วจ้า");
        }
        renderReviews();
    }

    function updateStoreInfo() {
        let newName = document.getElementById('admin-store-name').value;
        let newImg = document.getElementById('admin-store-img').value;
        if(newName) storeData.name = newName;
        if(newImg) storeData.image = newImg;
        
        document.getElementById('store-title').innerText = storeData.name;
        document.getElementById('store-avatar').src = storeData.image;
        alert("อัปเดตข้อมูลร้านเรียบร้อยแล้วค่ะ! 🎉");
    }

    function handleReviewSubmit(event) {
        event.preventDefault();
        
        let name = document.getElementById('cust-name').value;
        let rating = Number(document.getElementById('cust-rating').value);
        let comment = document.getElementById('cust-comment').value;
        let imageInput = document.getElementById('cust-image');

        if (imageInput.files && imageInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                reviews.unshift({ name, rating, comment, image: e.target.result });
                resetFormAndRender();
            }
            reader.readAsDataURL(imageInput.files[0]);
        } else {
            reviews.unshift({ name, rating, comment, image: "" });
            resetFormAndRender();
        }
    }

    function resetFormAndRender() {
        document.getElementById('review-form').reset();
        renderReviews();
        alert("ส่งรีวิวสำเร็จ ขอบคุณมากๆ เลยนะคะ! ✨💖");
    }

    function deleteReview(index) {
        if (confirm("ต้องการลบคอมเม้นต์นี้ (จัดการรีวิวปั่นเครดิต) ใช่ไหมคะ?")) {
            reviews.splice(index, 1);
            renderReviews();
        }
    }

    function renderReviews() {
        let listContainer = document.getElementById('reviews-list');
        listContainer.innerHTML = "";

        if (reviews.length === 0) {
            listContainer.innerHTML = "<p style='text-align: center; color: var(--text-sub); padding: 15px;'>ยังไม่มีรีวิวในขณะนี้ เป็นคนแรกที่ฝากเครดิตได้เลยน้า! ✨</p>";
            document.getElementById('avg-rating').innerText = "0.0";
            document.getElementById('total-reviews').innerText = "0";
            return;
        }

        let sumRating = 0;
        reviews.forEach((rev, index) => {
            sumRating += rev.rating;
            
            let stars = "⭐".repeat(rev.rating);
            let imgTag = rev.image ? `<img src="${rev.image}" class="review-img" alt="รูปรีวิว">` : "";
            
            let card = document.createElement('div');
            card.className = "review-card";
            card.innerHTML = `
                <button class="delete-btn" onclick="deleteReview(${index})">ลบรีวิว</button>
                <div style="font-weight: bold; color: #d6517a;">👤 ${rev.name}</div>
                <div style="margin: 5px 0;">${stars}</div>
                <p style="margin: 5px 0 10px; line-height: 1.4;">${rev.comment}</p>
                ${imgTag}
            `;
            listContainer.appendChild(card);
        });

        let avg = (sumRating / reviews.length).toFixed(1);
        document.getElementById('avg-rating').innerText = avg;
        document.getElementById('total-reviews').innerText = reviews.length;
    }

    renderReviews();
</script>

</body>
</html>
